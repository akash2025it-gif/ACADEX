# ==============================================================================
# ACADEX Render Deployment Blueprint
# Official Infrastructure-as-Code for Render Web Service + PostgreSQL
# ==============================================================================
# NOTE ON FREE TIER VS PRODUCTION PERSISTENCE:
# 1. Database: 'plan: free' PostgreSQL expires after 30 days. For long-term
#    production, upgrade the database to 'plan: starter' ($7/mo) or point
#    DATABASE_URL to an external perpetual PostgreSQL service (Supabase / Neon).
# 2. File Storage: Render free web services do NOT support persistent disks ('disk:').
#    On the free plan, uploads are stored in ephemeral local container storage
#    (/media/) which is wiped on instance restarts/redeploys.
#    For persistent production uploads without external S3, upgrade the web service
#    to 'plan: starter' and uncomment the 'disk:' section at the bottom.
# ==============================================================================

databases:
  - name: acadex-db
    databaseName: acadex
    user: acadex_user
    plan: free

services:
  - type: web
    name: acadex-backend
    runtime: python
    rootDir: ACADEX/backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://acadex-portal.vercel.app,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: acadex-db
          property: connectionString

    # --- PRODUCTION PERSISTENT DISK (Requires 'plan: starter' or higher) ---
    # To enable persistent storage on paid tier, change 'plan: free' to 'plan: starter'
    # and uncomment the disk configuration below:
    # disk:
    #   name: acadex-media
    #   mountPath: /opt/render/project/src/ACADEX/backend/media
    #   sizeGB: 1
