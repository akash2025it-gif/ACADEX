databases:
  - name: acadex-db
    databaseName: acadex
    user: acadex_user
    plan: free

services:
  - type: web
    name: acadex-backend
    runtime: python
    rootDir: ACADEX/backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput && python seed_data.py"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: acadex-db
          property: connectionString
    disk:
      name: acadex-media
      mountPath: /opt/render/project/src/ACADEX/backend/media
      sizeGB: 1
